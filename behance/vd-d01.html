<script>
/* D01 timeline, 4.0 s. Easing = ALTAI --ease cubic-bezier(.22,.61,.36,1) (arrive). No blur, no glow.
   0.20–0.70 label fades in · 0.30–1.30 "From structure" rises inside its mask ·
   0.70–1.80 "to feeling." rises inside its mask (slightly slower) · 1.80–4.00 hold on the approved static frame. */
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
 const X=t=>((ax*t+bx)*t+cx)*t,Y=t=>((ay*t+by)*t+cy)*t,dX=t=>(3*ax*t+2*bx)*t+cx;
 return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const d=dX(t);if(Math.abs(d)<1e-6)break;t-=(X(t)-x)/d;}return Y(t);};}
const ease=bez(.22,.61,.36,1), p=(t,a,d)=>ease(Math.min(1,Math.max(0,(t-a)/d)));
const LOOP=4.0;
const f=document.querySelector('section.f'); const els=f.querySelectorAll(':scope > .a');
const label=els[0], l1=els[1], l2=els[2];
for(const el of [l1,l2]){ el.style.clipPath='inset(-0.6em -0.4em -0.32em -0.4em)';
  el.innerHTML='<span style="display:block">'+el.innerHTML+'</span>'; }
const s1=l1.firstChild, s2=l2.firstChild;
function render(t){ t=Math.min(t,LOOP);
  label.style.opacity=p(t,0.20,0.50);
  s1.style.transform=`translateY(${(1-p(t,0.30,1.00))*1.45}em)`;
  s2.style.transform=`translateY(${(1-p(t,0.70,1.10))*1.45}em)`; }
window.__render=render;
const q=new URLSearchParams(location.search);
if(q.has('t')) render(parseFloat(q.get('t')));
else { let s=performance.now(); (function k(n){ let t=(n-s)/1000; if(t>LOOP+0.6){s=n;t=0;} render(t); requestAnimationFrame(k);})(s); }
</script></body></html>
